
plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

tasks.register('nativeCompile') {
    group = 'build'
    description = 'Runs nativeCompile on all subprojects'
    dependsOn subprojects.collect { sub ->
        sub.tasks.findByName('nativeCompile')
    }.findAll { it != null }
}
